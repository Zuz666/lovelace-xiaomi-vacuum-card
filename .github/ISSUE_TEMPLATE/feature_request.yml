name: Feature request
description: Suggest an improvement or new capability for the Xiaomi Vacuum Card.
title: "feat: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the user problem or limitation this would solve.
    validations:
      required: true
  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed solution
      description: Describe the behavior, configuration, or UI you want.
    validations:
      required: true
  - type: textarea
    id: alternatives-considered
    attributes:
      label: Alternatives considered
      description: Describe any workarounds or alternate approaches you considered.
  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add screenshots, examples, or related links.
