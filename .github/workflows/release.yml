name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the leading v
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      WORKFLOW_REF_NAME: ${{ github.ref_name }}
      WORKFLOW_REF_TYPE: ${{ github.ref_type }}
    steps:
      - name: Validate release branch
        run: |
          if [ "${WORKFLOW_REF_TYPE}" != "branch" ] || [ "${WORKFLOW_REF_NAME}" != "release" ]; then
            echo "Releases must be run from the release branch; current ref is ${WORKFLOW_REF_TYPE}/${WORKFLOW_REF_NAME}" >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate version
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"

          if [ "${RELEASE_VERSION}" != "${PACKAGE_VERSION}" ]; then
            echo "Requested version ${RELEASE_VERSION} does not match package.json version ${PACKAGE_VERSION}" >&2
            exit 1
          fi

          node -e "const version = process.argv[1]; const semver = /^(0|[1-9]\\d*)\\.(0|[1-9]\\d*)\\.(0|[1-9]\\d*)(?:-[0-9A-Za-z-]+(?:\\.[0-9A-Za-z-]+)*)?(?:\\+[0-9A-Za-z-]+(?:\\.[0-9A-Za-z-]+)*)?$/; if (!semver.test(version)) throw new Error('Invalid semver: ' + version);" "${RELEASE_VERSION}"

      - name: Check
        run: npm run check

      - name: Prepare HACS asset
        run: cp dist/xiaomi-vacuum-card.js xiaomi-vacuum-card.js

      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create and push tag
        run: |
          git tag -a "v${RELEASE_VERSION}" -m "v${RELEASE_VERSION}"
          git push origin "v${RELEASE_VERSION}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v${RELEASE_VERSION}" xiaomi-vacuum-card.js --title "v${RELEASE_VERSION}" --generate-notes
