name: Validate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 0"

permissions: {}

jobs:
  validate-hacs:
    name: validate-hacs
    runs-on: ubuntu-latest
    steps:
      - name: HACS Action
        uses: hacs/action@d556e736723344f83838d08488c983a15381059a # 22.5.0
        with:
          category: plugin
