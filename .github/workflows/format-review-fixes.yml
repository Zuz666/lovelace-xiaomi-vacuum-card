name: Format review fixes

on:
  push:
    branches:
      - agent/backlog-bootstrap

permissions:
  contents: write

jobs:
  format-review-fixes:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/backlog-bootstrap

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format review fixes
        run: |
          npx prettier --write \
            .github/backlog/p0-native-vacuum-state-features.md \
            tests/backlog-governance.test.mjs

      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/backlog/p0-native-vacuum-state-features.md \
            tests/backlog-governance.test.mjs

          if git diff --cached --quiet; then
            echo "No formatting changes required."
            exit 0
          fi

          git commit -m "style: format review fixes"
          git push
