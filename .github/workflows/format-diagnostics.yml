name: Format bootstrap branch

on:
  push:
    branches:
      - agent/backlog-bootstrap

permissions:
  contents: write

jobs:
  format-bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout bootstrap branch
        uses: actions/checkout@v7
        with:
          ref: agent/backlog-bootstrap

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format governance files
        run: |
          npx prettier --write \
            .github/ISSUE_TEMPLATE/bug_report.yml \
            .github/ISSUE_TEMPLATE/feature_request.yml \
            .github/ISSUE_TEMPLATE/compatibility_report.yml \
            .github/backlog/issues.json \
            docs/maintainers/backlog-governance.md \
            tests/backlog-governance.test.mjs

      - name: Commit formatting changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/ISSUE_TEMPLATE/bug_report.yml \
            .github/ISSUE_TEMPLATE/feature_request.yml \
            .github/ISSUE_TEMPLATE/compatibility_report.yml \
            .github/backlog/issues.json \
            docs/maintainers/backlog-governance.md \
            tests/backlog-governance.test.mjs

          if git diff --cached --quiet; then
            echo "Governance files already match Prettier."
            exit 0
          fi

          git commit -m "style: format backlog governance"
          git push origin HEAD:agent/backlog-bootstrap
