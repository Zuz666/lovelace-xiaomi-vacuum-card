name: Format testing strategy

on:
  push:
    branches:
      - agent/backlog-bootstrap

permissions:
  contents: write

jobs:
  format-testing-strategy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: agent/backlog-bootstrap

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format strategy
        run: npx prettier --write docs/maintainers/testing-strategy.md

      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/maintainers/testing-strategy.md

          if git diff --cached --quiet; then
            echo "No formatting changes required."
            exit 0
          fi

          git commit -m "style: format testing strategy"
          git push
