name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check build artifact synchronization
        run: npm run check:build

      - name: Check syntax
        run: npm run check:syntax
      - name: Check version
        run: npm run check:version

      - name: Lint JavaScript
        run: npm run lint:js

      - name: Lint Markdown
        run: npm run lint:md
      - name: Check formatting
        run: npm run format:check

      - name: Run tests
        run: npm test

  component-tests:
    runs-on: ubuntu-latest
    needs: checks

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browser binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Run component tests
        run: npm run test:component
  ha-smoke:
    runs-on: ubuntu-latest
    needs: checks
    env:
      HA_BASELINE_RELEASE: "2026.6.1"
      HA_IMAGE: ghcr.io/home-assistant/home-assistant@sha256:59aa8824955c9db491b75d2eebe42bd68494f80c2ec69ec0d66d9dae37d37514
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browser binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Prepare Home Assistant config
        run: |
          mkdir -p .ha-smoke/www/community/lovelace-xiaomi-vacuum-card
          cp tests/ha-smoke/home-assistant/*.yaml .ha-smoke/
          cp dist/xiaomi-vacuum-card.js .ha-smoke/www/community/lovelace-xiaomi-vacuum-card/xiaomi-vacuum-card.js

      - name: Cache Home Assistant Docker image
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: ha-docker-cache
        with:
          path: /tmp/ha-docker-cache
          key: ${{ runner.os }}-ha-docker-${{ env.HA_IMAGE }}-${{ hashFiles('tests/ha-smoke/home-assistant/*') }}
          restore-keys: |
            ${{ runner.os }}-ha-docker-${{ env.HA_IMAGE }}-

      - name: Load or pull Home Assistant Docker image
        env:
          CACHE_HIT: ${{ steps.ha-docker-cache.outputs.cache-hit }}
        run: |
          if [ "${CACHE_HIT}" = "true" ] && [ -f /tmp/ha-docker-cache/ha.tar ]; then
            echo "Loading Home Assistant image from cache..."
            docker load -i /tmp/ha-docker-cache/ha.tar
          else
            echo "Pulling Home Assistant image (${HA_IMAGE})..."
            docker pull "${HA_IMAGE}"
            mkdir -p /tmp/ha-docker-cache
            docker save "${HA_IMAGE}" -o /tmp/ha-docker-cache/ha.tar
          fi
      - name: Start Home Assistant
        run: |
          docker run \
            --detach \
            --name ha-smoke \
            --publish 8123:8123 \
            --volume "${{ github.workspace }}/.ha-smoke:/config" \
            "${HA_IMAGE}"
      - name: Wait for Home Assistant
        run: |
          for attempt in {1..90}; do
            if curl --connect-timeout 2 --max-time 5 --fail --silent --show-error http://127.0.0.1:8123/manifest.json >/dev/null; then
              exit 0
            fi

            sleep 2
          done

          docker logs ha-smoke
          exit 1

      - name: Run Home Assistant smoke test
        env:
          HA_BASE_URL: http://127.0.0.1:8123
        run: npm run test:ha-smoke

      - name: Capture Home Assistant logs
        if: always()
        run: |
          docker logs ha-smoke > ha-smoke.log 2>&1 || true

      - name: Upload Home Assistant logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: ha-smoke-logs-${{ github.run_id }}
          path: ha-smoke.log
          if-no-files-found: ignore

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: ha-smoke-playwright-artifacts-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

      - name: Add smoke test summary
        if: always()
        env:
          CARD_COMMIT: ${{ github.sha }}
          JOB_RESULT: ${{ job.status }}
        run: |
          echo "### Home Assistant Smoke Test Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "- **HA Baseline Release**: ${HA_BASELINE_RELEASE}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **HA Image**: \`${HA_IMAGE}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Card Commit**: \`${CARD_COMMIT}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Browser**: Chromium" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Scenario**: \`npm run test:ha-smoke\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Result**: ${JOB_RESULT}" >> "$GITHUB_STEP_SUMMARY"
      - name: Stop and remove Home Assistant container
        if: always()
        run: |
          docker rm -f ha-smoke || true
