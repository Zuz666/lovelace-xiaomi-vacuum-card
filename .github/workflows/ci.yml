name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check syntax
        run: npm run check:syntax

      - name: Check version
        run: npm run check:version

      - name: Lint JavaScript
        run: npm run lint:js

      - name: Lint Markdown
        run: npm run lint:md
      - name: Check formatting
        run: npm run format:check

      - name: Run tests
        run: npm test

  ha-smoke:
    runs-on: ubuntu-latest
    needs: checks

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browser binaries
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Prepare Home Assistant config
        run: |
          mkdir -p .ha-smoke/www/community/lovelace-xiaomi-vacuum-card
          cp tests/ha-smoke/home-assistant/*.yaml .ha-smoke/
          cp dist/xiaomi-vacuum-card.js .ha-smoke/www/community/lovelace-xiaomi-vacuum-card/xiaomi-vacuum-card.js

      - name: Start Home Assistant
        run: |
          docker run \
            --detach \
            --name ha-smoke \
            --publish 8123:8123 \
            --volume "${{ github.workspace }}/.ha-smoke:/config" \
            ghcr.io/home-assistant/home-assistant:stable

      - name: Wait for Home Assistant
        run: |
          for attempt in {1..90}; do
            if curl --fail --silent --show-error http://127.0.0.1:8123/manifest.json >/dev/null; then
              exit 0
            fi

            sleep 2
          done

          docker logs ha-smoke
          exit 1

      - name: Run Home Assistant smoke test
        env:
          HA_BASE_URL: http://127.0.0.1:8123
        run: npm run test:ha-smoke

      - name: Show Home Assistant logs
        if: failure()
        run: docker logs ha-smoke

      - name: Stop Home Assistant
        if: always()
        run: docker stop ha-smoke
