default_config:
demo:

input_select:
  vacuum_fan_speed:
    name: Vacuum Fan Speed
    options:
      - medium
      - max
    initial: max

template:
  - sensor:
      - name: "demo_vacuum_0_ground_floor_battery"
        unique_id: demo_vacuum_0_ground_floor_battery
        state: "73"
        device_class: battery
        unit_of_measurement: "%"

homeassistant:
  auth_providers:
    - type: trusted_networks
      trusted_networks:
        - 127.0.0.1
        - ::1
        - 172.16.0.0/12
      allow_bypass_login: true
    - type: homeassistant

lovelace:
  mode: yaml
  resources:
    - url: /local/community/lovelace-xiaomi-vacuum-card/xiaomi-vacuum-card.js
      type: module
